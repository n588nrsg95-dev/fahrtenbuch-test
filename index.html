<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Fahrtenbuch</title>
  <meta name="theme-color" content="#4f46e5">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css?v=6.3">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div>
      <h1>Fahrtenbuch</h1>
      <p>Version 6.3</p>
    </div>
    <button id="settingsBtn" class="icon" type="button">⚙️</button>
  </header>

  <main id="home" class="view active">
    <button id="driverCard" class="card select" type="button">
      <span>👤</span><div><small>Aktueller Fahrer</small><b id="currentDriver">Bitte auswählen</b></div><em>›</em>
    </button>
    <section class="actions">
      <button class="action first" data-kind="first" type="button"><span>🚩</span><div><b>ERSTER PATIENT</b><small>Tagesbeginn erfassen</small></div></button>
      <button class="action visit" data-kind="visit" type="button"><span>📍</span><div><b>ANKUNFT</b><small>Patientenbesuch erfassen</small></div></button>
      <button class="action last" data-kind="last" type="button"><span>🏁</span><div><b>LETZTER PATIENT</b><small>Tagesende erfassen</small></div></button>
    </section>
    <button id="entriesBtn" class="row" type="button"><span>☷</span><div><b>Einträge anzeigen</b><small>Chronologisch nach Tagen</small></div><em>›</em></button>
    <section class="summary"><span id="todayText">Heute</span><b id="todayCount">0 Einträge</b></section>
  </main>

  <main id="drivers" class="view">
    <div class="sub"><button class="back" type="button">‹</button><h2>Fahrer auswählen</h2><span></span></div>
    <section class="panel">
      <label>Bekannte Fahrer</label>
      <select id="driverSelect"><option value="">Bitte auswählen</option></select>
      <button id="useDriver" class="primary" type="button">Fahrer übernehmen</button>
      <div class="divider">oder</div>
      <label>Neuen Fahrer anlegen</label>
      <input id="newDriver" placeholder="Name der Fahrerin / des Fahrers">
      <button id="addDriver" class="secondary" type="button">+ Fahrer speichern</button>
      <div id="driverList" class="chips"></div>
    </section>
  </main>

  <main id="entryForm" class="view">
    <div class="sub"><button class="back" type="button">‹</button><h2 id="formTitle">Eintrag erfassen</h2><span></span></div>
    <section class="panel">
      <label>Fahrer</label>
      <div class="readonly" id="formDriver">-</div>
      <label>Anschrift</label>
      <select id="addressSelect"><option value="">Bitte auswählen</option></select>
      <textarea id="addressText" rows="3" placeholder="Neue Anschrift oder Korrektur eingeben"></textarea>
      <button id="saveAddressBtn" class="secondary" type="button">Anschrift merken</button>
      <label>Kilometerstand</label>
      <input id="kmInput" inputmode="numeric" pattern="[0-9]*" placeholder="z. B. 169748">
      <button id="photoBtn" class="smallPhoto" type="button">📷 Foto aufnehmen / hochladen (optional)</button>
      <input id="photoInput" type="file" accept="image/*" capture="environment" hidden>
      <div id="photoPreview" class="photoPreview hidden"></div>
      <button id="saveEntry" class="primary" type="button">Speichern</button>
    </section>
  </main>

  <main id="entries" class="view">
    <div class="sub"><button class="back" type="button">‹</button><h2>Einträge</h2><span></span></div>
    <div id="entryList" class="list"></div>
  </main>

  <main id="settings" class="view">
    <div class="sub"><button class="back" type="button">‹</button><h2>Einstellungen</h2><span></span></div>
    <section class="settings">
      <h3>Auswertung</h3>
      <label>Kilometervergütung</label>
      <div class="rate"><input id="rateInput" inputmode="decimal" value="0,30"><span>€/km</span></div>
      <button id="excelBtn" class="setrow" type="button"><div><b>Excel-Monatsabrechnung</b><small>.xls-Datei herunterladen</small></div><span>⬇️</span></button>
      <button id="pdfBtn" class="setrow" type="button"><div><b>PDF-Monatsabrechnung</b><small>In der App anzeigen / drucken</small></div><span>📄</span></button>
      <h3>Daten</h3>
      <button id="backupBtn" class="setrow" type="button"><div><b>Datensicherung exportieren</b><small>Backup als JSON</small></div><span>☁️</span></button>
      <button id="clearTripsBtn" class="setrow danger" type="button"><div><b>Fahrtenbuchdaten löschen</b><small>Nur Fahrten und Kilometerstände löschen</small></div><span>🗑️</span></button>
      <button id="clearContactsBtn" class="setrow danger" type="button"><div><b>Adressdaten löschen</b><small>Nur gespeicherte Anschriften löschen</small></div><span>🗑️</span></button>
      <button id="clearDriversBtn" class="setrow danger" type="button"><div><b>Fahrerdaten löschen</b><small>Nur gespeicherte Fahrer löschen</small></div><span>🗑️</span></button>
      <div class="version">Version 6.3</div>
    </section>
  </main>


  <main id="monthSelect" class="view">
    <div class="sub"><button id="monthBack" type="button">‹</button><h2>Monat auswählen</h2><span></span></div>
    <section class="panel">
      <p class="hint">Bitte wähle den Monat für die Abrechnung aus.</p>
      <div id="monthList" class="monthList"></div>
      <button id="monthExport" class="primary" type="button">Exportieren</button>
    </section>
  </main>

  <main id="pdfView" class="view">
    <div class="sub"><button id="pdfBack" type="button">‹</button><h2>PDF-Vorschau</h2><span></span></div>
    <section class="panel"><button id="printPdf" class="primary" type="button">PDF drucken / speichern</button></section>
    <section id="pdfContent" class="pdfContent"></section>
  </main>

  <main id="editEntry" class="view">
    <div class="sub"><button class="backEntries" type="button">‹</button><h2>Eintrag korrigieren</h2><span></span></div>
    <section class="panel">
      <label>Typ</label><select id="editKind"><option value="first">Erster Patient</option><option value="visit">Patient</option><option value="last">Letzter Patient</option></select>
      <label>Fahrer</label><select id="editDriver"></select>
      <label>Anschrift</label><textarea id="editAddress" rows="3"></textarea>
      <label>Kilometerstand</label><input id="editKm" inputmode="numeric">
      <button id="updateEntry" class="primary" type="button">Änderung speichern</button>
      <button id="deleteEntry" class="dangerBtn" type="button">Eintrag löschen</button>
    </section>
  </main>
</div>
<script src="app.js?v=6.3"></script>
</body>
</html>
